<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgSpace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgSpace)"/>
  <!-- Stars -->
  <circle cx="120" cy="80" r="2" fill="#ffffff"/>
  <circle cx="280" cy="50" r="1.5" fill="#38bdf8"/>
  <circle cx="650" cy="90" r="2.5" fill="#ffffff"/>
  <circle cx="540" cy="60" r="1.5" fill="#c084fc"/>
  <circle cx="710" cy="240" r="2" fill="#ffffff"/>
  <circle cx="90" cy="310" r="2" fill="#38bdf8"/>
  <circle cx="230" cy="200" r="1.5" fill="#ffffff"/>
  <circle cx="620" cy="340" r="2" fill="#ffffff"/>
  <!-- HUD Top -->
  <rect x="60" y="35" width="200" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="59" fill="#38bdf8" font-family="Consolas, monospace" font-size="16" font-weight="bold">SCORE: 04850</text>
  <rect x="560" y="35" width="180" height="36" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="585" y="59" fill="#f43f5e" font-family="Consolas, monospace" font-size="16" font-weight="bold">STAGE 03 | 60FPS</text>
