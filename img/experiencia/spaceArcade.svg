  <rect x="397" y="195" width="6" height="32" rx="3" fill="#38bdf8"/>
  <rect x="397" y="255" width="6" height="32" rx="3" fill="#38bdf8"/>
  <!-- Player Spaceship -->
  <polygon points="400,305 355,380 400,362 445,380" fill="#38bdf8" stroke="#e0f2fe" stroke-width="2"/>
  <polygon points="400,370 385,405 400,392 415,405" fill="#f97316"/>
