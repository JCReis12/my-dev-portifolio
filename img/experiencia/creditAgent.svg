<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071026"/>
      <stop offset="50%" stop-color="#0f2547"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Grid pattern -->
  <g stroke="#1e3a8a" stroke-width="1" opacity="0.3">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Connection lines -->
  <line x1="220" y1="225" x2="400" y2="145" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>
  <line x1="220" y1="225" x2="400" y2="305" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>
  <line x1="400" y1="145" x2="580" y2="225" stroke="#818cf8" stroke-width="3"/>
  <line x1="400" y1="305" x2="580" y2="225" stroke="#818cf8" stroke-width="3"/>
  <!-- BigQuery Node -->
  <rect x="130" y="175" width="140" height="100" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="200" y="218" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">BigQuery</text>
  <text x="200" y="242" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">Credit Data</text>
  <!-- Agent 1 -->
  <rect x="330" y="95" width="150" height="90" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
  <text x="405" y="135" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Risk Agent</text>
  <text x="405" y="158" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Google ADK</text>
  <!-- Agent 2 -->
  <rect x="330" y="265" width="150" height="90" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
  <text x="405" y="305" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Policy Agent</text>
  <text x="405" y="328" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">Python + LLM</text>
  <!-- Decision Output -->
  <rect x="530" y="170" width="150" height="110" rx="18" fill="#1e1b4b" stroke="url(#accent1)" stroke-width="3"/>
  <text x="605" y="212" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">AI Decision</text>
  <rect x="560" y="228" width="90" height="26" rx="13" fill="#10b981"/>
  <text x="605" y="246" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SCORE A+</text>
</svg>
